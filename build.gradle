plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
	// Terraformers maven for ModMenu
	maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	minecraft "net.minecraft:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Optional but most mods want it.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional ModMenu integration.
	modCompileOnly "com.terraformersmc:modmenu:17.0.1"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}

// Client regression tests use the built-in settings screen.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "simplecoords-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
dependencies { modRuntimeOnly "com.terraformersmc:modmenu:17.0.1" }
if (project.hasProperty('testCloth')) {
    dependencies { modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}" }
}
loom.runs.named('clientGameTest') {
    programArgs '--width', '1280', '--height', '720'
}

// Avoid the Fabric API 0.141.6 test-world login synchronizer stall.
tasks.named('runClientGameTest', JavaExec) {
    jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer'
}
