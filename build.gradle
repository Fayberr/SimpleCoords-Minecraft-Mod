plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    minecraft 'net.minecraft:minecraft:' + project.minecraft_version
    mappings 'net.fabricmc:yarn:' + project.yarn_mappings + ':v2'
    modImplementation 'net.fabricmc:fabric-loader:' + project.loader_version
    modImplementation 'net.fabricmc.fabric-api:fabric-api:' + project.fabric_version

    modCompileOnly "com.terraformersmc:modmenu:16.0.1"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
                'minecraft_version': project.minecraft_version,
                'loader_version': project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}


fabricApi {
    configureTests {
        createSourceSet = true
        modId = "simplecoords-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
dependencies { modRuntimeOnly "com.terraformersmc:modmenu:16.0.1" }
if (project.hasProperty('testCloth')) {
    dependencies { modRuntimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}" }
}
loom.runs.named('clientGameTest') {
    programArgs '--width', '1280', '--height', '720'
}
