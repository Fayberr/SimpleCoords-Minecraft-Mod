plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

version = mod_version
group = mod_group_id
base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    validateAccessTransformers = true

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
    mavenLocal()
}

dependencies {
    compileOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

sourceSets {
    settingsTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.settingsTestImplementation.extendsFrom(configurations.implementation)
configurations.settingsTestCompileOnly.extendsFrom(configurations.compileOnly)
configurations.settingsTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)
neoForge.addModdingDependenciesTo(sourceSets.settingsTest)
if (project.hasProperty('testCloth')) {
    dependencies { runtimeOnly "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}" }
}
if (project.hasProperty('settingsTest')) {
    neoForge {
        mods {
            simplecoords_settings_test { sourceSet sourceSets.settingsTest }
        }
        runs {
            settingsTest {
                client()
                sourceSet = sourceSets.settingsTest
                gameDirectory = file('build/run/settingsTest')
                programArguments.addAll '--width', '1280', '--height', '720'
            }
        }
    }
}
