plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.group

base {
	archivesName = project.archives_base_name
}

repositories {
    mavenLocal()
    maven { name = 'Shedaniel'; url = 'https://maven.shedaniel.me/' }
	// Terraformers maven for ModMenu
	maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    compileOnly "net.fayber:modern-config:1.9.5+26.2"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Optional but most mods want it.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Extra mods as compileOnly (no remap needed on 26.1+):
	compileOnly "com.terraformersmc:modmenu:20.0.2"
}

processResources {
	inputs.property 'version', project.version
	inputs.property 'minecraft_version', project.minecraft_version
	inputs.property 'loader_version', project.loader_version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version,
				'minecraft_version': project.minecraft_version,
				'loader_version': project.loader_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from('LICENSE') {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "simplecoords-test"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

configurations.gametestCompileOnly.extendsFrom(configurations.compileOnly)
dependencies { runtimeOnly "com.terraformersmc:modmenu:20.0.2" }
if (project.hasProperty('testCloth') || project.hasProperty('testModernConfig')) {
    dependencies { runtimeOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}" }
}
if (project.hasProperty('testModernConfig')) {
    dependencies {
        runtimeOnly "net.fayber:modern-config:1.9.5+26.2"
        runtimeOnly "net.fayber:modern-gui:1.0.14+26.2"
    }
}
loom.runs.named('clientGameTest') {
    programArgs '--width', '1280', '--height', '720'
}
